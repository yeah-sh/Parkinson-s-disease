# Dataset identity and on-disk locations.
# Relative paths are resolved against the project root (the directory that contains configs/).

dataset:
  id: ds002778        # OpenNeuro: UC San Diego resting-state EEG, Parkinson's disease and controls
  version: "1.0.5"
  task: rest
  datatype: eeg
  extension: .bdf
  # Mains frequency in Hz. Use this, not the per-recording sidecar value: 9 of the 46 sidecars
  # say 50, but no recording has a 50 Hz spectral peak and 37 have a clear one at 60.
  line_freq: 60.0
  montage: biosemi32  # MNE standard montage; also defines which channels are scalp EEG

paths:
  raw: data/raw/ds002778
  interim: data/interim
  processed: data/processed
  reports: reports
  recordings: data/interim/recordings.parquet  # one row per recording, written by `pdeeg recordings`

# BIDS session label -> who was recorded and in which state. participants.tsv has no group
# column, so the session label is what identifies patients and controls.
# Keep "off" and "on" quoted: unquoted, YAML reads them as booleans.
sessions:
  hc:
    group: HC
    condition: HC
  "off":
    group: PD
    condition: PD_OFF
  "on":
    group: PD
    condition: PD_ON

# participants.tsv column -> name used in the recordings table.
# The dataset calls the column "gender"; BIDS and the rest of this project call it "sex".
participants_rename:
  gender: sex

# Scalp regions of the biosemi32 montage, for region-averaged features: a region's value is the
# mean of its channels' values. Every channel is in exactly one region. The lateral row (FC5/6,
# T7/8, CP5/6) is "temporal": T7 and T8 alone would be a two-channel average of the channels
# most exposed to muscle. P7 and P8 (T5 and T6 in the older naming) are counted as parietal.
regions:
  frontal: [Fp1, Fp2, AF3, AF4, F7, F3, Fz, F4, F8]
  central: [FC1, FC2, C3, Cz, C4, CP1, CP2]
  temporal: [FC5, FC6, T7, T8, CP5, CP6]
  parietal: [P7, P3, Pz, P4, P8]
  occipital: [PO3, PO4, O1, Oz, O2]
