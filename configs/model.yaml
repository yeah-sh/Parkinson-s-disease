# Classification (pdeeg.models, `pdeeg classify`): secondary and exploratory.
# Written on 2026-10-23, before any classifier was run on the data. With 15 patients and 16
# controls the curators of ds002778 warn that classifying patients against controls is
# statistically fragile; the group statistics of configs/stats.yaml are the primary result.

random_state: 20261023

# Which values of the feature tables are used: as in stats.yaml, the windows that touch a stretch
# marked bad are left out.
segments: clean
# "region": each feature averaged over the channels of a region (data.yaml), 5 values per feature.
# "channel": one value per channel, and then a univariate selection (SelectKBest, ANOVA F) of
# channel_k features inside every training fold, k tuned in the inner loop.
level: region
channel_k: [10, 30, 100]

# Each task contrasts two sets of conditions (names come from sessions in data.yaml).
# exclude_recordings and weights were added on 2026-10-26 with the tasks at the end of this list;
# for (A) and (B) they are empty and per_recording, which is what these tasks always did.
# exclude_recordings drops single recordings, as [subject, session] pairs. weights:
# per_recording counts every recording once; per_participant gives each participant a total
# weight of 1 over their recordings, in training, in the inner-loop scores and in every metric.
tasks:
  pd_vs_hc:           # (A) unmedicated patients against controls: one recording per participant
    positive: [PD_OFF]
    negative: [HC]
    paired: false
    exclude_subjects: []
    exclude_recordings: []
    weights: per_recording
  off_vs_on:          # (B) the same patients in both classes
    positive: [PD_OFF]
    negative: [PD_ON]
    # Within patients: each patient's features are centred on the mean of their own two
    # recordings, so a classifier decides which of a patient's two recordings is OFF (chance
    # 50 %), and labels are permuted within patients. The centring uses nothing but that one
    # patient's two recordings, and no label.
    paired: true
    # Their ON sessions were exported already preprocessed (configs/stats.yaml), so a classifier
    # could learn the processing instead of the medication.
    exclude_subjects: [pd6, pd16]
    exclude_recordings: []
    weights: per_recording

  # --- Added on 2026-10-26, AFTER the pre-registration above, and before any classifier had
  # been run on the data. Why: the project is turned into a two-stage research tool for a single
  # recording: stage 1 asks patient or control, stage 2 asks (for a patient) OFF or ON. Neither
  # task above fits that. (A) uses only OFF recordings, but a patient seen in practice is usually
  # ON; (B) centres each patient on their own two recordings, so it needs both and cannot label
  # one recording on its own. (B) stays as the paired mode of stage 2.
  pd_any_vs_hc:       # (C) stage 1: patients in either state against controls
    positive: [PD_OFF, PD_ON]
    negative: [HC]
    paired: false
    exclude_subjects: []
    # The ON sessions of pd6 and pd16 were exported already preprocessed (see (B)); their OFF
    # sessions are kept.
    exclude_recordings: [[pd6, "on"], [pd16, "on"]]
    # Both sessions of a patient are used, at 0.5 each (1 for pd6 and pd16), so that every
    # participant counts once and the classes stay 15 against 16 people. Splits are by
    # participant, so a patient's two recordings are always on the same side.
    weights: per_participant
  off_vs_on_single:   # (D) stage 2, single-recording mode: each recording on its own
    positive: [PD_OFF]
    negative: [PD_ON]
    paired: false     # no centring: the classifier sees one recording and nothing else
    exclude_subjects: [pd6, pd16]   # as in (B)
    exclude_recordings: []
    weights: per_recording          # every patient has one recording of each class
    # Both classes come from the same patients, so labels are permuted within patients.

# Feature sets of the ablation, by the tables they draw on: "psd" and "mfdfa" are the wide
# feature tables, "confounds" is age and sex (1 for m, 0 for f). Age and sex do not change within
# a patient, so a set of confounds alone is not run for a task within patients ((B) and (D)).
feature_sets:
  psd: [psd]
  mfdfa: [mfdfa]
  psd_mfdfa: [psd, mfdfa]
  age_sex: [confounds]

# Inner-loop grids. Every model follows a StandardScaler (and the selection, for channels) in one
# Pipeline, so all of it is fitted on training folds only.
classifiers:
  logistic_regression:    # saga solver; l1_ratio 0 is L2, 1 is L1, 0.5 elastic net
    C: [0.01, 0.1, 1.0]
    l1_ratio: [0.0, 0.5, 1.0]
    max_iter: 5000
  linear_svm:             # SVC with a linear kernel; its decision function is the score
    C: [0.001, 0.01, 0.1, 1.0]
  gradient_boosting:      # small: 100 stumps or depth-2 trees
    n_estimators: [100]
    max_depth: [1, 2]
    learning_rate: [0.1]

cv:
  group_key: participant_id   # every split is by participant: no person is in train and test
  # Outer loop. Leave-one-subject-out was timed first: one nested run of task A on 31 participants
  # and 130 features took 104 s with logistic regression and 321 s with gradient boosting (with
  # the MFDFA extraction running alongside), and every p-value needs 1000 such runs, which comes
  # to weeks of CPU over the 21 task, feature set and model combinations. Stratified 5-fold grouped by participant needs about a sixth of it, keeps 6 or
  # 7 test participants and the class ratio in every fold, and is used for the scores and their
  # permutation nulls alike.
  outer: stratified_group_kfold   # or leave_one_subject_out
  outer_folds: 5
  inner_folds: 3                  # grouped and stratified too
  # The metric that is reported. ROC AUC was tried first, for being smoother on folds of 8 to 10
  # people, but on synthetic data (tests/test_models.py) it chose models so regularised that
  # their scores ranked people well while their intercept put everyone in one class.
  inner_scoring: balanced_accuracy
  # The scores are from one outer split. The analysis is repeated on this many other splits to
  # show how much the choice of split alone moves balanced accuracy; no p-value is taken there.
  split_repeats: 10
  n_permutations: 1000            # every one repeats the whole nested cross-validation
  n_bootstrap: 2000               # over participants, on the out-of-fold predictions
  confidence: 0.95

# MLflow 3.17 no longer accepts a plain ./mlruns directory as the tracking store, so runs are
# recorded in a SQLite database and only the artifacts go to a directory.
tracking:
  db: mlflow.db       # SQLite tracking database
  artifacts: mlruns   # artifact store
  experiment: pdeeg

report: reports/classification_results.md
figures_dir: reports/figures/classification
n_jobs: 18            # permutations run in parallel; does not affect the results

# --- The two-stage cascade (pdeeg.models.cascade, `pdeeg cascade`). Added on 2026-10-26, AFTER
# the pre-registration above and before any classifier had been run on the data, for the reason
# given at tasks (C) and (D). In every outer fold (cv above: grouped by participant), stage 1 and
# stage 2 are each tuned and fitted on the training participants alone, with their own inner
# loop, and every held-out recording is called HC, PD_OFF or PD_ON: HC if stage 1 says so, else
# stage 2 decides. The permutation test, the bootstrap and the other splits are those of cv.
cascade:
  stage1: pd_any_vs_hc
  stage2: off_vs_on_single
  # One configuration, fixed before any result: every feature (no feature set is picked on
  # results), and logistic regression, whose probabilities the calibration below needs, with
  # the elastic-net grid of classifiers.logistic_regression.
  feature_set: psd_mfdfa
  model: logistic_regression
  calibration:
    # Platt scaling, fitted inside every outer training set on grouped inner-fold predictions,
    # is always computed next to the raw probabilities, and a rule fixed in advance
    # (pdeeg.models.calibration) says which to use. Isotonic regression is not used: it is a
    # free step function, and with about 25 training participants per fold it would overfit.
    method: sigmoid
    # Reliability diagrams: bins of equal count, about 9 recordings each for stage 1 (44) and 6
    # for stage 2 (28).
    n_bins: 5
  report: reports/cascade_results.md
  figures_dir: reports/figures/cascade

# --- The final models (`pdeeg train-final`, used by `pdeeg predict`). Added on 2026-10-26. -------
# For each stage: the task, and the feature set and model with the best cross-validated balanced
# accuracy of that task in the ablation above (age and sex alone left out; ties go to the higher
# ROC AUC). It is written here from reports/classification_results.md after `pdeeg classify`,
# before any final model is trained, and `pdeeg train-final` refuses to run if it is not that
# best combination. Being the best of several on the same cross-validation, its score is
# optimistic; the models' metadata says so and carries the cascade's pre-specified estimate too.
# null until the ablation has been run.
#
# Filled on 2026-10-26 with the block `pdeeg train-final` printed from the classification
# summary, after `pdeeg classify` (all four tasks) and `pdeeg cascade`.
final:
  stage1:
    task: pd_any_vs_hc
    feature_set: psd_mfdfa
    model: linear_svm
  stage2_single:
    task: off_vs_on_single
    feature_set: psd
    model: logistic_regression
  stage2_paired:
    task: off_vs_on
    feature_set: psd
    model: logistic_regression
