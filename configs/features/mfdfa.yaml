# Multifractal Detrended Fluctuation Analysis, per channel.
# Provisional defaults, written before the feature code exists; revisit when it lands.
# Preprocessing delivers one continuous 180 s recording per session, not epochs.

# Moment orders q, from q_min to q_max inclusive.
q_min: -5.0
q_max: 5.0
q_step: 0.5

# Window sizes in samples, log-spaced. These were chosen for 10 s segments at 512 Hz
# (5120 samples), so that every scale has at least 10 windows; reconsider them for the
# continuous recordings.
scale_min: 16
scale_max: 512
n_scales: 20

detrend_order: 1      # polynomial order removed from each window

features: [hurst_q2, delta_h, alpha_peak, alpha_width, alpha_asymmetry]
