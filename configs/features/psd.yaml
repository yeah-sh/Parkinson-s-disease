# Band-power baseline features (pdeeg.features.psd), per channel of the continuous recording.
# Like the MFDFA features they are computed twice, on every Welch segment and on the segments
# that touch no stretch annotated BAD. None of these values was tuned on the data.

method: welch
fmin: 1.0             # Hz
fmax: 48.0
window_sec: 2.0       # Welch segment length (Hann taper): 0.5 Hz resolution, 179 segments
overlap: 0.5          # fraction of a segment

relative: true        # divide each band by total power in [fmin, fmax]
log: true             # log10 of band power

# [low, high) in Hz. Contiguous, unlike the legacy notebooks (which left a 12-13 Hz gap).
bands:
  delta: [1.0, 4.0]
  theta: [4.0, 8.0]
  alpha: [8.0, 13.0]
  beta: [13.0, 30.0]
  gamma: [30.0, 48.0]
