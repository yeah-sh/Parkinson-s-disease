name: CI

# Lint and unit tests on synthetic data. The OpenNeuro dataset is never downloaded here: the two
# tests that read it are marked `dataset` and left out.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test, Python 3.11
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MPLBACKEND: Agg
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev,app]"
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Makefile targets resolve
        run: make --dry-run all download preprocess features stats classify report test FORCE=1 N_JOBS=2
      - name: Tests on synthetic data
        run: pytest -m "not dataset"

  docker:
    name: Docker image builds and starts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t pdeeg .
      - name: Start
        run: |
          docker run --rm pdeeg --version
          docker run --rm pdeeg config > /dev/null
          docker run --rm pdeeg report || test $? -eq 1   # no data: says what to run, exit 1
